appId: com.factor1.notetaker
productName: Meeting Notetaker
icon: build/icon.ico
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!{electron.vite.config.ts,.gitignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js}'
  - '!docs/**'
  - '!.env*'
  - '!backend/**'
  - '!scripts/**'
  - '!recordings/**'
  - '!dist/**'
  - '!*.tsbuildinfo'
extraResources:
  - from: backend/dist/notetaker-backend
    to: backend
  - from: seed-data
    to: seed-data
  - from: resources/tray-icon.png
    to: tray-icon.png
extraMetadata:
  SliceVersion: 1.0.0
win:
  target:
    - nsis
    # Intune Win32 packaging (IN-89): DV confirmed approach. See:
    # https://learn.microsoft.com/en-us/intune/app-management/deployment/create-win32-package
    # NSIS -> Intune Win32 prep tool flow to be added after signing.
  signAndEditExecutable: false
  # Note: code signing requires certificate (IN-81). Release builds run in CI
  # with signing enabled. Local dev uses signAndEditExecutable: false.
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-${version}-setup.${ext}
publish:
  provider: generic
  url: https://REPLACE_ME.blob.core.windows.net/updates/
  # electron-updater verifies a downloaded installer's Authenticode subject CN
  # against this before installing (IN-469); Private Trust root exists on the
  # managed fleet. Lives under `publish` (as an array — the installed
  # electron-builder schema rejects both a bare `win.publisherName` and a
  # scalar `publish.publisherName`): NsisUpdater reads `publisherName`
  # straight off the generated app-update.yml's publish config at
  # update-check time, so this is the field it actually consults.
  publisherName:
    - factor1.com.au
