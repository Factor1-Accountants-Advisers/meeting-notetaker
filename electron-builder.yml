appId: com.factor1.notetaker
productName: Meeting Notetaker
icon: build/icon.ico
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!{electron.vite.config.ts,.gitignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js}'
  - '!docs/**'
  - '!.env*'
  - '!backend/**'
  - '!scripts/**'
  - '!recordings/**'
  - '!dist/**'
  - '!*.tsbuildinfo'
  # Rust sources + cargo target tree; the built helper ships via extraResources.
  # Without this the release runner's cargo build lands ~300MB in app.asar.
  - '!native/**'
  # Stale git worktrees (superpowers tooling) — a full repo copy that was
  # silently inflating installers since July.
  - '!.worktrees/**'
  # Repo-root credentials file. The app reads resources/backend/backend.env
  # (extraResources) or the ProgramData override — the asar copy was an
  # unread, rotation-proof duplicate of live keys in every installer.
  - '!backend.env*'
  - '!{.ruff_cache,.claude}/**'
# seed-data (bundled voiceprint preload) removed 31 Jul 2026: obsolete since
# the central voiceprint store + enrolment gate (Slice 2), and it shipped a
# real employee's biometric embedding in every installer (30 Jul security
# triage). backend-supervisor's seedInitialData degrades to a logged skip
# when the directory is absent.
extraResources:
  - from: backend/dist/notetaker-backend
    to: backend
  # IN-472 fix: theme-paired tray icons. Both must ship — shipping only one is the
  # IN-472 bug (a white glyph is invisible on a light taskbar).
  - from: resources/tray-icon-light.ico
    to: tray-icon-light.ico
  - from: resources/tray-icon-dark.ico
    to: tray-icon-dark.ico
  # Native Core Audio observer. Kept outside ASAR so Electron can spawn it.
  # Staged directory copy: electron-builder 26 bypasses its Windows signing
  # transformer for single-file extraResources mappings, and a directory
  # mapping must not point into the cargo target/ tree (installer bloat).
  - from: native/audio-endpoint-monitor/dist
    to: audio
    filter:
      - notetaker-audio-endpoints.exe
extraMetadata:
  SliceVersion: 1.0.0
win:
  target:
    - nsis
    # Intune Win32 packaging (IN-89): DV confirmed approach. See:
    # https://learn.microsoft.com/en-us/intune/app-management/deployment/create-win32-package
    # NSIS -> Intune Win32 prep tool flow to be added after signing.
  signAndEditExecutable: false
  # Note: code signing requires certificate (IN-81). Release builds run in CI
  # with signing enabled. Local dev uses signAndEditExecutable: false.
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-${version}-setup.${ext}
  # IN-484: kills orphaned notetaker-backend.exe at install/uninstall init.
  include: build/installer.nsh
# IN-483: toast action buttons activate via this protocol (Windows drops
# foreground-activation arguments for apps without a COM activator). The
# installer registers the scheme; setAsDefaultProtocolClient covers dev.
protocols:
  - name: Meeting Notetaker
    schemes:
      - notetaker
publish:
  provider: generic
  url: https://stf1nt.blob.core.windows.net/updates/
  # electron-updater verifies a downloaded installer's Authenticode subject CN
  # against this before installing (IN-469); Private Trust root exists on the
  # managed fleet. Lives under `publish` (as an array — the installed
  # electron-builder schema rejects both a bare `win.publisherName` and a
  # scalar `publish.publisherName`): NsisUpdater reads `publisherName`
  # straight off the generated app-update.yml's publish config at
  # update-check time, so this is the field it actually consults.
  publisherName:
    # Full DN, not bare CN: electron-updater matches either, but the DN pins
    # O/OU too (its own log warns when only a CN is configured). Applies to
    # installs made from this version onward.
    - CN=factor1.com.au, O=factor1.com.au, OU=IT Shared Services
