# Release build (decision #12): tag vX.Y.Z -> build, sign, publish.
#
# Signing (IN-81): Azure Artifact Signing (formerly Trusted Signing) against
# IT's as-factor1 account — config in electron-builder.azure.yml, auth via
# azure/login OIDC (no stored secrets). Prerequisites, once per repo:
#   1. Entra app registration with a federated credential for this repo's
#      GitHub Actions OIDC (subject: repo:Factor1-Accountants-Advisers/
#      meeting-notetaker:ref:refs/tags/v*), granted "Artifact Signing
#      Certificate Profile Signer" on as-factor1 by IT (DV).
#   2. Repo secrets: AZURE_SIGNING_CLIENT_ID, AZURE_TENANT_ID,
#      AZURE_SUBSCRIPTION_ID (IT-Shared-Services).
# The signature uses PRIVATE TRUST: only Intune-managed devices trust it, so
# the verify step below asserts signature presence + timestamp, not chain.
#
# Fully live as of 31 Jul 2026 (IN-469): the updates feed is provisioned
# (public-read `updates` container on stf1nt, publish.url set,
# UPDATES_STORAGE_ACCOUNT repo variable set, release identity granted
# Storage Blob Data Contributor on the container). The publish step's
# REPLACE_ME guard is kept as regression protection only.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # azure/login OIDC federation (IN-81 signing)

jobs:
  build-backend:
    runs-on: windows-latest
    outputs:
      bundle-path: backend/dist/notetaker-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Download ffmpeg (gyan.dev 7.1.1 essentials, LGPL, pinned)
        # Pinned versioned build + SHA256 verification (30 Jul security
        # triage: the previous rolling git-essentials URL was unpinned and
        # unverified — a compromised upstream would have shipped straight
        # into the installer). Bumping ffmpeg = update BOTH url and hash.
        working-directory: backend
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-7.1.1-essentials_build.7z"
          $expected = "411d0ae70b72d16f0049696b525a1e24774cacc08fbc30caf042c291c9df43b9"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z
          $actual = (Get-FileHash ffmpeg.7z -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Error "ffmpeg.7z SHA256 mismatch: expected $expected got $actual - refusing to package an unverified binary"
            exit 1
          }
          7z x ffmpeg.7z -offmpeg-extracted
          New-Item -ItemType Directory -Force third_party\ffmpeg
          Copy-Item ffmpeg-extracted\*\bin\ffmpeg.exe third_party\ffmpeg\ffmpeg.exe

      - name: Build backend bundle (PyInstaller onedir)
        working-directory: backend
        run: python -m PyInstaller meeting-notetaker-backend.spec

      - name: Smoke test the bundle
        shell: pwsh
        run: .\scripts\smoke-backend-bundle.ps1

      - name: Upload backend bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: notetaker-backend-bundle
          path: backend/dist/notetaker-backend/
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download backend bundle
        uses: actions/download-artifact@v4
        with:
          name: notetaker-backend-bundle
          path: backend/dist/notetaker-backend

      - name: Type check
        run: npm run typecheck

      - name: Write credentials file (from GitHub secrets)
        # utf8NoBOM is required: a BOM-prefixed first line corrupts the first
        # key name and the supervisor would silently fall back to stubs.
        shell: pwsh
        env:
          MN_OPENAI_API_KEY: ${{ secrets.MN_OPENAI_API_KEY }}
          MN_PYANNOTE_API_KEY: ${{ secrets.MN_PYANNOTE_API_KEY }}
          # Non-secret rollout config (repository variables). Without the
          # expansion list, manual/ad-hoc recordings only ever consider the
          # recorder's own voiceprint (IN-79) — a silent behaviour regression
          # against locally built installers.
          MN_VOICEPRINT_EXPANSION_EMPLOYEE_IDS: ${{ vars.MN_VOICEPRINT_EXPANSION_EMPLOYEE_IDS }}
          MN_VOICEPRINT_EXPANSION_CAP: ${{ vars.MN_VOICEPRINT_EXPANSION_CAP }}
        run: |
          $lines = @()
          if ($env:MN_OPENAI_API_KEY) { $lines += "MN_OPENAI_API_KEY=$env:MN_OPENAI_API_KEY" }
          if ($env:MN_PYANNOTE_API_KEY) { $lines += "MN_PYANNOTE_API_KEY=$env:MN_PYANNOTE_API_KEY" }
          if ($env:MN_VOICEPRINT_EXPANSION_EMPLOYEE_IDS) {
            $lines += "MN_VOICEPRINT_EXPANSION_EMPLOYEE_IDS=$env:MN_VOICEPRINT_EXPANSION_EMPLOYEE_IDS"
            if ($env:MN_VOICEPRINT_EXPANSION_CAP) { $lines += "MN_VOICEPRINT_EXPANSION_CAP=$env:MN_VOICEPRINT_EXPANSION_CAP" }
          } else {
            Write-Warning "MN_VOICEPRINT_EXPANSION_EMPLOYEE_IDS repo variable not set — manual recordings will only match the recorder's voiceprint (IN-79 expansion disabled)"
          }
          if ($lines.Count -eq 0) {
            Write-Error "No credential secrets set — refusing to build a stub installer for release"
            exit 1
          }
          $lines -join "`n" | Out-File -Encoding utf8NoBOM -FilePath backend.env
          Write-Host "Wrote backend.env ($($lines.Count) keys)"

      - name: Pre-package checks (bundle + ffmpeg + credentials into staging)
        run: node scripts/prepackage.cjs

      - name: Azure login for Artifact Signing (OIDC, IN-81)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build signed installer (Azure Artifact Signing, IN-81)
        # electron-builder.azure.yml extends the base config with the signing
        # account/profile and re-enables exe metadata editing (disabled in the
        # base config for dev machines without the symlink privilege). Signing
        # covers the inner binaries and the NSIS setup exe, timestamped per
        # DV's brief.
        run: npx electron-vite build && npx electron-builder --publish never --config electron-builder.azure.yml

      - name: Assert installer and app binary are signed and timestamped
        # Private Trust: the runner does NOT have the factor1 root, so chain
        # validation is expected to fail here — assert signature presence,
        # signer subject, and timestamp instead. Managed-device validation is
        # DV's step.
        shell: pwsh
        run: |
          $targets = @(
            (Get-ChildItem "dist\*setup.exe" | Select-Object -First 1).FullName,
            "dist\win-unpacked\Meeting Notetaker.exe"
          )
          foreach ($target in $targets) {
            if (-not $target -or -not (Test-Path $target)) {
              Write-Error "Expected build output missing: $target"
              exit 1
            }
            $sig = Get-AuthenticodeSignature -FilePath $target
            if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) {
              Write-Error "$target is NOT signed (status: $($sig.Status))"
              exit 1
            }
            if ($sig.SignerCertificate.Subject -notmatch 'factor1\.com\.au') {
              Write-Error "$target signed by unexpected subject: $($sig.SignerCertificate.Subject)"
              exit 1
            }
            if (-not $sig.TimeStamperCertificate) {
              Write-Error "$target signature is not timestamped — will break on cert rollover"
              exit 1
            }
            Write-Host "OK: $target signed by '$($sig.SignerCertificate.Subject)', timestamped by '$($sig.TimeStamperCertificate.Subject)' (chain status on runner: $($sig.Status) — untrusted chain is expected under Private Trust)"
          }

      - name: Assert credentials shipped in packaged output
        shell: pwsh
        run: |
          $packagedEnv = "dist/win-unpacked/resources/backend/backend.env"
          if (-not (Test-Path $packagedEnv)) {
            Write-Error "Packaged output is missing $packagedEnv — installer would ship stub-only"
            exit 1
          }
          Write-Host "Packaged credentials present: $packagedEnv"

      - name: Publish to Blob update feed (IN-469)
        # Live since 31 Jul 2026. The REPLACE_ME guard below is regression
        # protection (a reverted publish.url must skip, not upload a feed
        # pointing nowhere). Two single uploads, NOT upload-batch (it
        # honors only one --pattern). latest.yml emission with
        # `--publish never` verified locally 31 Jul.
        shell: pwsh
        run: |
          $config = Get-Content electron-builder.yml -Raw
          if ($config -match 'REPLACE_ME') {
            Write-Warning "Update feed not provisioned (publish.url placeholder) - skipping publish. Installer is only a workflow artifact."
            exit 0
          }
          if (-not $env:UPDATES_STORAGE_ACCOUNT) {
            Write-Error "publish.url is set but UPDATES_STORAGE_ACCOUNT repo variable is not - refusing a half-configured publish"
            exit 1
          }
          $exe = (Get-ChildItem "dist\*setup.exe" | Select-Object -First 1).FullName
          az storage blob upload --auth-mode login --overwrite `
            --account-name $env:UPDATES_STORAGE_ACCOUNT --container-name updates `
            --file $exe --name (Split-Path $exe -Leaf)
          az storage blob upload --auth-mode login --overwrite `
            --account-name $env:UPDATES_STORAGE_ACCOUNT --container-name updates `
            --file dist\latest.yml --name latest.yml
        env:
          UPDATES_STORAGE_ACCOUNT: ${{ vars.UPDATES_STORAGE_ACCOUNT }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: meeting-notetaker-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
